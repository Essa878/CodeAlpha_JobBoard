<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobBoard — Find your next role</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>" />
  <style>
    :root {
      --bg: #f5f8f8;
      --surface: #ffffff;
      --surface-2: #eef4f4;
      --border: #dfe9e9;
      --text: #0f2027;
      --muted: #5d7079;
      --primary: #0d9488;
      --primary-600: #0f766e;
      --primary-soft: #e6f5f3;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(15,32,39,.04), 0 8px 24px rgba(15,32,39,.06);
      --shadow-lg: 0 12px 40px rgba(15,32,39,.16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary-600); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
    .muted { color: var(--muted); }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

    .appbar { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.86); backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--border); }
    .appbar-inner { display: flex; align-items: center; gap: 16px; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; }
    .brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--accent)); display: grid; place-items: center; color: #fff; font-size: 1rem; box-shadow: 0 6px 16px rgba(13,148,136,.4); }
    .nav { display: flex; gap: 4px; margin-left: 12px; flex-wrap: wrap; }
    .nav button { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 600; }
    .nav button:hover { background: var(--surface-2); color: var(--text); }
    .nav button.active { background: var(--primary-soft); color: var(--primary-600); }
    .spacer { flex: 1; }
    .user-chip { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #14b8a6, #0891b2); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .85rem; }

    .btn { border: 1px solid transparent; border-radius: var(--radius-sm); padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; justify-content: center; transition: transform .06s ease, background .15s ease, box-shadow .15s ease; white-space: nowrap; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-600)); color: #fff; box-shadow: 0 6px 16px rgba(13,148,136,.35); }
    .btn.primary:hover:not(:disabled) { box-shadow: 0 8px 22px rgba(13,148,136,.45); }
    .btn.ghost { background: var(--surface); border-color: var(--border); color: var(--text); }
    .btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
    .btn.soft { background: var(--primary-soft); color: var(--primary-600); }
    .btn.soft:hover:not(:disabled) { background: #d8efec; }
    .btn.danger { background: #fff; border-color: #fecaca; color: var(--danger); }
    .btn.danger:hover:not(:disabled) { background: #fef2f2; }
    .btn.sm { padding: 6px 12px; font-size: .85rem; }
    .btn.block { width: 100%; }

    .field { display: grid; gap: 6px; }
    .field > label { font-size: .82rem; font-weight: 600; color: var(--muted); }
    input, select, textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; transition: border .15s, box-shadow .15s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,148,136,.15); }
    textarea { resize: vertical; min-height: 90px; }

    .hero { margin: 26px 0 22px; padding: 30px 28px; border-radius: 20px; color: #fff; background: radial-gradient(1100px 380px at 0% 0%, #0891b2 0%, transparent 55%), linear-gradient(135deg, #0f766e, #0d9488 55%, #0891b2); box-shadow: var(--shadow-lg); }
    .hero h2 { font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: -.02em; }
    .hero p { margin: 8px 0 0; opacity: .93; max-width: 580px; }
    .hero .stats { display: flex; gap: 26px; margin-top: 20px; flex-wrap: wrap; }
    .hero .stat b { display: block; font-size: 1.5rem; } .hero .stat span { font-size: .8rem; opacity: .85; }

    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .toolbar .grow { flex: 1; min-width: 200px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; transition: transform .12s ease, box-shadow .12s ease; }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .card h3 { font-size: 1.05rem; letter-spacing: -.01em; }
    .company { color: var(--muted); font-size: .88rem; font-weight: 600; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: .86rem; }
    .meta span { display: inline-flex; align-items: center; gap: 6px; }
    .desc { color: var(--muted); font-size: .9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; flex-wrap: wrap; }
    .salary { font-weight: 700; color: var(--primary-600); }

    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); text-transform: capitalize; }
    .badge.teal { background: var(--primary-soft); color: var(--primary-600); }
    .badge.green { background: #e7f8f1; color: #0f766e; }
    .badge.amber { background: #fef3c7; color: #b45309; }
    .badge.red { background: #fef2f2; color: #b91c1c; }
    .badge.gray { background: var(--surface-2); color: var(--muted); }

    .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .stat-card .k { color: var(--muted); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .stat-card .v { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }

    .empty { text-align: center; padding: 54px 20px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface); }
    .empty .ic { font-size: 2.4rem; }
    .loading { display: grid; place-items: center; padding: 60px; color: var(--muted); }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay { position: fixed; inset: 0; background: rgba(6,26,30,.5); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; z-index: 60; animation: fade .15s ease; }
    @keyframes fade { from { opacity: 0; } }
    .modal { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg); width: 100%; max-width: 540px; max-height: 90vh; overflow: auto; animation: pop .18s cubic-bezier(.2,.8,.2,1); }
    @keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
    .modal.wide { max-width: 720px; }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; padding: 20px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); border-radius: 18px 18px 0 0; }
    .modal-head h3 { font-size: 1.2rem; letter-spacing: -.02em; }
    .modal-body { padding: 20px 22px; display: grid; gap: 16px; }
    .modal-foot { padding: 16px 22px 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .x { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; color: var(--muted); line-height: 1; }
    .x:hover { background: #e2ecec; }

    .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
    .tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; font: inherit; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tabs button.active { color: var(--primary-600); border-bottom-color: var(--primary); }

    .list-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: center; }
    .list-row:last-child { border-bottom: 0; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    tbody tr:hover { background: var(--surface-2); }

    .toast-wrap { position: fixed; bottom: 20px; right: 20px; display: grid; gap: 10px; z-index: 90; }
    .toast { background: #0f2027; color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow-lg); font-size: .9rem; animation: pop .18s ease; max-width: 340px; }
    .toast.ok { background: #065f46; } .toast.err { background: #991b1b; }

    /* notifications */
    .bell { position: relative; border: 1px solid var(--border); background: var(--surface); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 1.05rem; display: grid; place-items: center; }
    .bell .dot { position: absolute; top: -5px; right: -5px; background: var(--danger); color: #fff; font-size: .68rem; font-weight: 700; min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; padding: 0 4px; }
    .notif-panel { position: absolute; right: 0; top: 46px; width: 360px; max-width: 90vw; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 50; overflow: hidden; }
    .notif-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .notif-list { max-height: 400px; overflow: auto; }
    .notif-item { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
    .notif-item.unread { background: var(--primary-soft); }
    .notif-item .msg { font-size: .88rem; }
    .notif-item .time { font-size: .74rem; color: var(--muted); margin-top: 2px; }

    .hide { display: none !important; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    section.view { padding-bottom: 60px; }
    .section-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 22px 0 14px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 600; }
    @media (max-width: 680px) {
      .appbar-inner { height: auto; padding: 10px 0; flex-wrap: wrap; }
      .nav { order: 3; width: 100%; overflow-x: auto; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="container appbar-inner">
      <div class="brand"><span class="logo">💼</span> JobBoard</div>
      <nav class="nav" id="nav"></nav>
      <div class="spacer"></div>
      <div class="user-chip" id="user-chip"></div>
    </div>
  </header>

  <main class="container" id="main"></main>

  <div class="toast-wrap" id="toasts"></div>
  <div id="modal-root"></div>

  <script>
    const state = {
      token: localStorage.getItem('jb_token') || null,
      user: null,
      view: 'browse',
      filters: { search: '', location: '', type: '', category: '', salaryMin: '', sort: 'newest' },
      notif: { open: false, unread: 0, items: [] },
      applications: [],
    };
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const initials = (n) => String(n || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
    const JOB_TYPES = ['full-time', 'part-time', 'contract', 'internship'];
    const APP_STATUSES = ['applied', 'reviewing', 'shortlisted', 'rejected', 'hired'];
    const STATUS_BADGE = { applied: 'gray', reviewing: 'amber', shortlisted: 'teal', rejected: 'red', hired: 'green' };

    const fmtDate = (v) => { const d = new Date((v || '').replace(' ', 'T') + (String(v).includes('Z') || String(v).includes('T') ? '' : 'Z')); return isNaN(d) ? String(v ?? '') : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); };
    const timeAgo = (v) => { const d = new Date((v || '').replace(' ', 'T')); if (isNaN(d)) return ''; const s = (Date.now() - d.getTime()) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; };
    const money = (n) => n == null ? '' : Number(n).toLocaleString();
    const salary = (min, max) => {
      if (min == null && max == null) return 'Salary not specified';
      if (min != null && max != null) return `$${money(min)} – $${money(max)}`;
      if (min != null) return `From $${money(min)}`;
      return `Up to $${money(max)}`;
    };

    function toast(msg, type = '') {
      const t = document.createElement('div');
      t.className = 'toast ' + type; t.textContent = msg;
      $('#toasts').appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2600);
    }

    async function api(path, opts = {}) {
      const headers = opts.headers || {};
      if (!(opts.body instanceof FormData) && opts.body) headers['Content-Type'] = 'application/json';
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      const res = await fetch(path, { ...opts, headers });
      const data = res.status === 204 ? null : await res.json().catch(() => null);
      if (!res.ok) throw new Error((data && data.error) || `Request failed (${res.status})`);
      return data;
    }

    async function downloadWithAuth(url, filename) {
      const res = await fetch(url, { headers: { Authorization: `Bearer ${state.token}` } });
      if (!res.ok) { toast('Download failed', 'err'); return; }
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename || 'resume';
      document.body.appendChild(a); a.click(); a.remove();
    }

    /* modals */
    function openModal(html, { wide = false } = {}) {
      const root = $('#modal-root');
      root.innerHTML = `<div class="overlay"><div class="modal ${wide ? 'wide' : ''}">${html}</div></div>`;
      const overlay = $('.overlay', root);
      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
      $$('.x', root).forEach((b) => b.onclick = closeModal);
      return root;
    }
    function closeModal() { $('#modal-root').innerHTML = ''; }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    /* ---------------- auth ---------------- */
    async function loadMe() {
      if (!state.token) return;
      try { state.user = (await api('/api/auth/me')).user; } catch { state.token = null; localStorage.removeItem('jb_token'); }
    }
    function logout() { state.token = null; state.user = null; state.view = 'browse'; localStorage.removeItem('jb_token'); render(); }

    function openAuthModal(mode = 'login') {
      let modalMode = mode;
      const root = openModal(`
        <div class="modal-head">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff;font-size:1.25rem;box-shadow:0 6px 16px rgba(13,148,136,.4)">💼</div>
            <div><h3 id="a-title">Welcome back</h3><div class="muted" style="font-size:.9rem" id="a-sub">Sign in to your account</div></div>
          </div>
          <button class="x">×</button>
        </div>
        <div class="modal-body">
          <div class="tabs" style="justify-content:center"><button id="t-login" class="active">Login</button><button id="t-reg">Sign up</button></div>
          <form id="a-form" class="field" style="gap:12px"></form>
        </div>
        <div class="modal-foot"><button class="btn ghost" id="a-cancel">Cancel</button><button class="btn primary" id="a-submit" form="a-form" style="flex:1">Login</button></div>`);
      const setMode = (m) => {
        modalMode = m;
        $('#t-login').classList.toggle('active', m === 'login');
        $('#t-reg').classList.toggle('active', m === 'register');
        $('#a-title').textContent = m === 'login' ? 'Welcome back' : 'Create your account';
        $('#a-sub').textContent = m === 'login' ? 'Sign in to your account' : 'Join as a candidate or employer';
        $('#a-submit').textContent = m === 'login' ? 'Login' : 'Create account';
        $('#a-form').innerHTML = m === 'login'
          ? `<div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div>
             <div class="field"><label>Password</label><input name="password" type="password" required placeholder="••••••••"></div>`
          : `<div class="field"><label>Full name</label><input name="name" required placeholder="Jane Doe"></div>
             <div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div>
             <div class="field"><label>Password</label><input name="password" type="password" required minlength="6" placeholder="At least 6 characters"></div>
             <div class="field"><label>I am a</label><select name="role" id="a-role"><option value="candidate">Candidate — looking for jobs</option><option value="employer">Employer — hiring</option></select></div>
             <div class="field hide" id="a-company-wrap"><label>Company name</label><input name="companyName" placeholder="Acme Inc."></div>`;
        if (m === 'register') {
          const sel = $('#a-role');
          const wrap = $('#a-company-wrap');
          sel.onchange = () => { wrap.classList.toggle('hide', sel.value !== 'employer'); };
        }
      };
      setMode(mode);
      $('#t-login').onclick = () => setMode('login');
      $('#t-reg').onclick = () => setMode('register');
      $('#a-cancel').onclick = closeModal;
      $('#a-form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = $('#a-submit'); btn.disabled = true;
        const body = Object.fromEntries(new FormData(e.target));
        try {
          const data = await api(modalMode === 'login' ? '/api/auth/login' : '/api/auth/register', { method: 'POST', body: JSON.stringify(body) });
          state.token = data.token; state.user = data.user; localStorage.setItem('jb_token', data.token);
          closeModal(); toast(`Welcome, ${data.user.name}!`, 'ok');
          state.view = data.user.role === 'admin' ? 'admin' : data.user.role === 'employer' ? 'dashboard' : 'browse';
          render();
        } catch (err) { toast(err.message, 'err'); btn.disabled = false; }
      };
    }

    /* ---------------- shell ---------------- */
    function render() {
      renderNav(); renderUserChip(); closeNotifPanel();
      $('#main').innerHTML = '';
      const v = state.view;
      if (v === 'browse') renderBrowse();
      else if (v === 'applications') renderMyApplications();
      else if (v === 'dashboard') renderEmployerDashboard();
      else if (v === 'profile') renderProfile();
      else if (v === 'admin') renderAdmin();
      else renderBrowse();
      if (state.user) refreshNotifications();
    }

    function renderNav() {
      const items = [];
      const r = state.user?.role;
      items.push(['browse', 'Browse jobs']);
      if (r === 'candidate') items.push(['applications', 'My applications'], ['profile', 'Profile']);
      if (r === 'employer') items.push(['dashboard', 'Dashboard'], ['profile', 'Company']);
      if (r === 'admin') items.splice(0, items.length, ['admin', 'Admin']);
      $('#nav').innerHTML = items.map(([id, label]) => `<button data-view="${id}" class="${state.view === id ? 'active' : ''}">${label}</button>`).join('');
      $$('#nav [data-view]').forEach((b) => b.onclick = () => { state.view = b.dataset.view; render(); });
    }

    function renderUserChip() {
      const chip = $('#user-chip');
      if (!state.user) {
        chip.innerHTML = `<button class="btn primary sm" id="auth-btn">Login / Sign up</button>`;
        $('#auth-btn').onclick = () => openAuthModal('login');
        return;
      }
      chip.innerHTML = `
        <div style="position:relative">
          <button class="bell" id="bell">🔔${state.notif.unread ? `<span class="dot">${state.notif.unread}</span>` : ''}</button>
          <div id="notif-slot"></div>
        </div>
        <div class="avatar" title="${esc(state.user.role)}">${esc(initials(state.user.name))}</div>
        <div style="line-height:1.15"><div style="font-weight:700;font-size:.9rem">${esc(state.user.name)}</div><div class="muted" style="font-size:.78rem;text-transform:capitalize">${esc(state.user.role)}</div></div>
        <button class="btn ghost sm" id="logout-btn">Log out</button>`;
      $('#logout-btn').onclick = logout;
      $('#bell').onclick = (e) => { e.stopPropagation(); toggleNotifPanel(); };
    }

    /* ---------------- notifications ---------------- */
    async function refreshNotifications() {
      try {
        const data = await api('/api/notifications');
        state.notif.unread = data.unread; state.notif.items = data.notifications;
        const bell = $('#bell');
        if (bell) bell.innerHTML = `🔔${data.unread ? `<span class="dot">${data.unread}</span>` : ''}`;
        if (state.notif.open) renderNotifPanel();
      } catch {}
    }
    function closeNotifPanel() { state.notif.open = false; const s = $('#notif-slot'); if (s) s.innerHTML = ''; }
    function toggleNotifPanel() { state.notif.open = !state.notif.open; renderNotifPanel(); }
    function renderNotifPanel() {
      const slot = $('#notif-slot');
      if (!slot || !state.notif.open) { if (slot) slot.innerHTML = ''; return; }
      const items = state.notif.items;
      slot.innerHTML = `<div class="notif-panel">
        <div class="notif-head"><b>Notifications</b><button class="btn ghost sm" id="read-all">Mark all read</button></div>
        <div class="notif-list">${items.length ? items.map((n) => `
          <div class="notif-item ${n.isRead ? '' : 'unread'}" data-nid="${n.id}">
            <div style="flex:1"><div class="msg">${esc(n.message)}</div><div class="time">${esc(timeAgo(n.createdAt))}</div></div>
            <button class="x" style="width:26px;height:26px;font-size:.9rem" data-del-n="${n.id}">✕</button>
          </div>`).join('') : '<div class="empty" style="border:0;padding:30px"><div class="ic">🔕</div>No notifications</div>'}</div>
      </div>`;
      $('#read-all').onclick = async () => { await api('/api/notifications/read-all', { method: 'POST' }); refreshNotifications(); };
      $$('#notif-slot [data-nid]').forEach((el) => el.onclick = async (e) => {
        if (e.target.dataset.delN) return;
        await api(`/api/notifications/${el.dataset.nid}/read`, { method: 'POST' }).catch(() => {});
        refreshNotifications();
      });
      $$('#notif-slot [data-del-n]').forEach((b) => b.onclick = async (e) => { e.stopPropagation(); await api(`/api/notifications/${b.dataset.delN}`, { method: 'DELETE' }).catch(() => {}); refreshNotifications(); });
    }
    document.addEventListener('click', () => { if (state.notif.open) closeNotifPanel(); });
    setInterval(() => { if (state.user) refreshNotifications(); }, 30000);

    /* ---------------- browse ---------------- */
    async function renderBrowse() {
      const main = $('#main');
      main.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
      let jobs;
      try { jobs = await loadJobs(); } catch (e) { main.innerHTML = errHtml(e.message); return; }
      const openJobs = jobs.filter((j) => j.status === 'open').length;
      const companies = new Set(jobs.map((j) => j.companyName || j.employerName)).size;
      main.innerHTML = `
        <section class="view">
          <div class="hero">
            <h2>Find a job you'll love</h2>
            <p>Discover opportunities from top companies. Candidates apply in one click; employers post roles and manage applicants end-to-end.</p>
            <div class="stats">
              <div class="stat"><b>${jobs.length}</b><span>Listings</span></div>
              <div class="stat"><b>${openJobs}</b><span>Open roles</span></div>
              <div class="stat"><b>${companies}</b><span>Companies</span></div>
            </div>
          </div>
          <div class="toolbar">
            <input class="grow" id="f-search" placeholder="Search jobs by title, description, category…" value="${esc(state.filters.search)}" />
            <input id="f-location" placeholder="Location" style="width:auto;min-width:150px" value="${esc(state.filters.location)}" />
            <select id="f-type" style="width:auto"><option value="">All types</option>${JOB_TYPES.map((t) => `<option value="${t}" ${state.filters.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
            <select id="f-salary" style="width:auto"><option value="">Any salary</option><option value="30000">$30k+</option><option value="60000">$60k+</option><option value="100000">$100k+</option></select>
            <select id="f-sort" style="width:auto"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="salary">Highest salary</option></select>
            ${state.user?.role === 'employer' ? `<button class="btn primary" id="post-job">＋ Post a job</button>` : ''}
          </div>
          <div class="section-title"><h3>${jobs.length} job${jobs.length === 1 ? '' : 's'} found</h3></div>
          <div class="grid" id="jobs-grid"></div>
        </section>`;
      renderJobCards(jobs);
      bindBrowse();
      const pj = $('#post-job'); if (pj) pj.onclick = () => openJobForm();
    }

    async function loadJobs() {
      const p = new URLSearchParams();
      if (state.filters.search) p.set('search', state.filters.search);
      if (state.filters.location) p.set('location', state.filters.location);
      if (state.filters.type) p.set('type', state.filters.type);
      if (state.filters.salaryMin) p.set('salaryMin', state.filters.salaryMin);
      if (state.filters.sort) p.set('sort', state.filters.sort);
      return api('/api/jobs' + (p.toString() ? '?' + p : ''));
    }

    function renderJobCards(jobs) {
      const grid = $('#jobs-grid');
      if (!jobs.length) { grid.outerHTML = emptyHtml('No jobs match your search', 'Try adjusting the filters or search terms.'); return; }
      grid.innerHTML = jobs.map((j) => {
        const closed = j.status === 'closed';
        const applied = j.hasApplied;
        return `<article class="card clickable" data-job="${j.id}">
          <div class="card-top">
            <div>
              <h3>${esc(j.title)}</h3>
              <div class="company">${esc(j.companyName || j.employerName)}${j.industry ? ` · ${esc(j.industry)}` : ''}</div>
            </div>
            ${closed ? '<span class="badge red">Closed</span>' : applied ? '<span class="badge teal">✓ Applied</span>' : '<span class="badge green">Open</span>'}
          </div>
          <div class="meta">
            ${j.location ? `<span>📍 ${esc(j.location)}</span>` : ''}
            <span>🕒 ${esc(j.jobType)}</span>
            ${j.category ? `<span>🏷 ${esc(j.category)}</span>` : ''}
            <span>👥 ${j.applicantCount} applicant${j.applicantCount === 1 ? '' : 's'}</span>
          </div>
          <div class="salary">${esc(salary(j.salaryMin, j.salaryMax))}</div>
          ${j.description ? `<div class="desc">${esc(j.description)}</div>` : ''}
          <div class="card-actions"><button class="btn soft sm" data-view-job="${j.id}">View job</button></div>
        </article>`;
      }).join('');
      $$('#jobs-grid .card').forEach((c) => c.onclick = () => openJobDetail(c.dataset.job));
    }

    function bindBrowse() {
      const s = $('#f-search'); if (s) { let t; s.oninput = () => { clearTimeout(t); t = setTimeout(() => { state.filters.search = s.value.trim(); renderBrowse(); }, 320); }; }
      const l = $('#f-location'); if (l) { let t; l.oninput = () => { clearTimeout(t); t = setTimeout(() => { state.filters.location = l.value.trim(); renderBrowse(); }, 320); }; }
      const ty = $('#f-type'); if (ty) ty.onchange = () => { state.filters.type = ty.value; renderBrowse(); };
      const sa = $('#f-salary'); if (sa) sa.onchange = () => { state.filters.salaryMin = sa.value; renderBrowse(); };
      const so = $('#f-sort'); if (so) so.onchange = () => { state.filters.sort = so.value; renderBrowse(); };
    }

    async function openJobDetail(id) {
      const root = openModal(`<div class="loading"><div class="spinner"></div></div>`, { wide: true });
      let j;
      try { j = await api('/api/jobs/' + id); } catch (e) { root.innerHTML = ''; toast(e.message, 'err'); return; }
      const isOwner = state.user?.role === 'employer' && state.user.id === j.employerId;
      const isCandidate = state.user?.role === 'candidate';
      let action = '';
      if (isCandidate) {
        if (j.hasApplied) action = `<span class="chip">Status: <span class="badge ${STATUS_BADGE[j.applicationStatus] || 'gray'}">${esc(j.applicationStatus)}</span></span>`;
        else if (j.status === 'closed') action = `<button class="btn primary" disabled>Closed</button>`;
        else action = `<button class="btn primary" id="apply-btn">Apply now</button>`;
      } else if (!state.user) {
        action = `<button class="btn primary" id="need-auth">Sign in to apply</button>`;
      } else if (isOwner) {
        action = `<button class="btn ghost" id="view-apps">View applicants</button><button class="btn ghost" id="edit-job">Edit</button><button class="btn danger" id="del-job">Delete</button>`;
      }
      openModal(`
        <div class="modal-head">
          <div>
            <h3>${esc(j.title)}</h3>
            <div class="company" style="margin-top:4px">${esc(j.companyName || j.employerName)}${j.industry ? ` · ${esc(j.industry)}` : ''}</div>
          </div>
          <button class="x">×</button>
        </div>
        <div class="modal-body">
          <div class="meta" style="font-size:.9rem">
            ${j.location ? `<span>📍 ${esc(j.location)}</span>` : ''}
            <span>🕒 ${esc(j.jobType)}</span>
            ${j.category ? `<span>🏷 ${esc(j.category)}</span>` : ''}
            <span>👥 ${j.applicantCount} applicant${j.applicantCount === 1 ? '' : 's'}</span>
          </div>
          <div class="chip" style="font-size:.95rem">💰 ${esc(salary(j.salaryMin, j.salaryMax))}</div>
          <div><h4 style="margin-bottom:6px">Description</h4><p style="margin:0;color:#33484f;white-space:pre-wrap">${esc(j.description || 'No description provided.')}</p></div>
        </div>
        <div class="modal-foot">${action}<button class="btn ghost" id="close-detail">Close</button></div>`, { wide: true });
      $('#close-detail').onclick = closeModal;
      const ab = $('#apply-btn'); if (ab) ab.onclick = () => openApplyModal(j);
      const na = $('#need-auth'); if (na) na.onclick = () => { closeModal(); openAuthModal('login'); };
      const va = $('#view-apps'); if (va) va.onclick = () => { closeModal(); openApplicants(j.id, j.title); };
      const ej = $('#edit-job'); if (ej) ej.onclick = () => { closeModal(); openJobForm(j); };
      const dj = $('#del-job'); if (dj) dj.onclick = async () => { if (!confirm('Delete this job and all its applications?')) return; try { await api('/api/jobs/' + id, { method: 'DELETE' }); toast('Job deleted'); closeModal(); render(); } catch (e) { toast(e.message, 'err'); } };
    }

    function openApplyModal(job) {
      openModal(`
        <div class="modal-head"><div><h3>Apply to ${esc(job.title)}</h3><div class="muted" style="font-size:.88rem">${esc(job.companyName || job.employerName)}</div></div><button class="x">×</button></div>
        <div class="modal-body">
          <div class="field"><label>Cover letter (optional)</label><textarea id="cover" placeholder="Tell them why you're a great fit…"></textarea></div>
        </div>
        <div class="modal-foot"><button class="btn ghost" id="c">Cancel</button><button class="btn primary" id="s">Submit application</button></div>`);
      $('#c').onclick = closeModal;
      $('#s').onclick = async () => {
        const btn = $('#s'); btn.disabled = true;
        try { await api(`/api/jobs/${job.id}/apply`, { method: 'POST', body: JSON.stringify({ coverLetter: $('#cover').value }) }); toast('Application submitted!', 'ok'); closeModal(); render(); }
        catch (e) { toast(e.message, 'err'); btn.disabled = false; }
      };
    }

    /* ---------------- employer dashboard ---------------- */

            <div class="stat-card"><div class="k">Shortlisted</div><div class="v">${stats.shortlisted}</div></div>

      $('#post-job').onclick = () => showPost();
      $('#dtab-post').onclick = () => showPost();
      $('#dtab-jobs').onclick = () => showJobs();
      $('#dtab-report').onclick = () => showReport();

      const setTab = (id) => $$('.tabs button').forEach((b) => b.classList.toggle('active', b.id === id));
      const showJobs = () => {
        setTab('dtab-jobs');
        const box = $('#dash-body');
        if (!jobs.length) { box.innerHTML = emptyHtml('No jobs posted yet', 'Post your first role to start receiving applications.'); return; }
        box.innerHTML = `<div class="grid">${jobs.map((j) => `
          <article class="card">
            <div class="card-top">
              <div><h3>${esc(j.title)}</h3><div class="company">${j.location ? esc(j.location) : 'Remote / unspecified'} · ${esc(j.jobType)}</div></div>
              ${j.status === 'open' ? '<span class="badge green">Open</span>' : '<span class="badge gray">Closed</span>'}
            </div>
            <div class="meta"><span>👥 ${j.applicantCount} applicants</span><span>💰 ${esc(salary(j.salaryMin, j.salaryMax))}</span><span>🗓 ${esc(fmtDate(j.createdAt))}</span></div>
            <div class="card-actions">
              <button class="btn soft sm" data-apps="${j.id}">Applicants (${j.applicantCount})</button>
              <button class="btn ghost sm" data-toggle="${j.id}" data-status="${j.status}">${j.status === 'open' ? 'Close' : 'Reopen'}</button>
              <button class="btn ghost sm" data-edit="${j.id}">Edit</button>
              <button class="btn danger sm" data-del="${j.id}">Delete</button>
            </div>
          </article>`).join('')}</div>`;
        $$('#dash-body [data-apps]').forEach((b) => b.onclick = () => openApplicants(b.dataset.apps, jobs.find((x) => String(x.id) === b.dataset.apps)?.title));
        $$('#dash-body [data-edit]').forEach((b) => b.onclick = () => openJobForm(jobs.find((x) => String(x.id) === b.dataset.edit)));
        $$('#dash-body [data-toggle]').forEach((b) => b.onclick = async () => {
          const next = b.dataset.status === 'open' ? 'closed' : 'open';
          try { await api('/api/jobs/' + b.dataset.toggle, { method: 'PUT', body: JSON.stringify({ status: next }) }); toast('Updated'); renderEmployerDashboard(); } catch (e) { toast(e.message, 'err'); }
        });
        $$('#dash-body [data-del]').forEach((b) => b.onclick = async () => { if (!confirm('Delete this job?')) return; try { await api('/api/jobs/' + b.dataset.del, { method: 'DELETE' }); toast('Deleted'); renderEmployerDashboard(); } catch (e) { toast(e.message, 'err'); } });
      };
      const showPost = () => { setTab('dtab-post'); $('#dash-body').innerHTML = jobFormHtml(); bindJobForm(async (body) => { await api('/api/jobs', { method: 'POST', body: JSON.stringify(body) }); toast('Job posted', 'ok'); renderEmployerDashboard(); }); };
      const showReport = () => {
        setTab('dtab-report');
        const box = $('#dash-body');
        if (!report.jobs.length) { box.innerHTML = emptyHtml('No data yet', 'Post jobs and receive applications to see reports.'); return; }
        box.innerHTML = `
          <div class="stat-cards">
            <div class="stat-card"><div class="k">Total applications</div><div class="v">${report.totals.totalApplications}</div></div>
            <div class="stat-card"><div class="k">Shortlisted</div><div class="v">${report.totals.shortlisted}</div></div>
            <div class="stat-card"><div class="k">Hired</div><div class="v">${report.totals.hired}</div></div>
          </div>
          <div class="card" style="padding:0;overflow:hidden">
            <table><thead><tr><th>Job</th><th>Status</th><th>Total</th><th>Applied</th><th>Reviewing</th><th>Shortlisted</th><th>Rejected</th><th>Hired</th></tr></thead>
            <tbody>${report.jobs.map((r) => `<tr><td><b>${esc(r.title)}</b></td><td><span class="badge ${r.status === 'open' ? 'green' : 'gray'}">${esc(r.status)}</span></td><td>${r.totalApplications}</td><td>${r.byStatus.applied}</td><td>${r.byStatus.reviewing}</td><td>${r.byStatus.shortlisted}</td><td>${r.byStatus.rejected}</td><td>${r.byStatus.hired}</td></tr>`).join('')}</tbody></table>
          </div>`;
      };
      showJobs();
    }

    function jobFormHtml(j = {}) {
      return `<form class="card" style="max-width:680px;gap:14px" id="job-form">
        <div class="field"><label>Job title</label><input name="title" required placeholder="e.g. Backend Engineer" value="${esc(j.title || '')}"></div>
        <div class="field"><label>Description</label><textarea name="description" placeholder="Responsibilities, requirements, perks…">${esc(j.description || '')}</textarea></div>
        <div class="row" style="gap:14px">
          <div class="field" style="flex:1;min-width:180px"><label>Location</label><input name="location" placeholder="e.g. Remote / Berlin" value="${esc(j.location || '')}"></div>
          <div class="field" style="flex:1;min-width:180px"><label>Category</label><input name="category" placeholder="e.g. Engineering" value="${esc(j.category || '')}"></div>
        </div>
        <div class="row" style="gap:14px">
          <div class="field" style="flex:1;min-width:160px"><label>Job type</label><select name="jobType">${JOB_TYPES.map((t) => `<option value="${t}" ${j.jobType === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
          <div class="field" style="flex:1;min-width:130px"><label>Salary min</label><input name="salaryMin" type="number" min="0" placeholder="60000" value="${j.salaryMin ?? ''}"></div>
          <div class="field" style="flex:1;min-width:130px"><label>Salary max</label><input name="salaryMax" type="number" min="0" placeholder="90000" value="${j.salaryMax ?? ''}"></div>
        </div>
        <div><button class="btn primary" type="submit">${j.id ? 'Save changes' : 'Post job'}</button></div>
      </form>`;
    }
    function bindJobForm(onSubmit) {
      $('#job-form').onsubmit = async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target));
        ['salaryMin', 'salaryMax'].forEach((k) => { body[k] = body[k] === '' ? null : Number(body[k]); });
        try { await onSubmit(body); } catch (err) { toast(err.message, 'err'); }
      };
    }
    function openJobForm(j) {
      closeModal();
      const root = openModal(`<div class="modal-head"><h3>${j && j.id ? 'Edit job' : 'Post a job'}</h3><button class="x">×</button></div><div class="modal-body">${jobFormHtml(j || {})}</div>`, { wide: true });
      bindJobForm(async (body) => {
        await api(j && j.id ? '/api/jobs/' + j.id : '/api/jobs', { method: j && j.id ? 'PUT' : 'POST', body: JSON.stringify(body) });
        toast(j && j.id ? 'Saved' : 'Job posted', 'ok'); closeModal(); render();
      });
    }

                  <select data-aid="${a.id}" class="status-select" style="width:auto">${APP_STATUSES.map((s) => `<option value="${s}" ${a.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>

        catch (e) { toast(e.message, 'err'); }
      });

    /* ---------------- profile ---------------- */
    async function renderProfile() {
      const main = $('#main');
      main.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
      if (state.user.role === 'candidate') {
        let p;
        try { p = await api('/api/candidates/me'); } catch (e) { main.innerHTML = errHtml(e.message); return; }
        main.innerHTML = `
          <section class="view">
            <div class="section-title"><div><h2>My profile</h2><div class="muted">Keep your profile fresh — employers see this</div></div></div>
            <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
              <form class="card" id="cand-form" style="gap:14px">
                <h3>Details</h3>
                <div class="field"><label>Headline</label><input name="headline" placeholder="e.g. Full-stack developer" value="${esc(p.headline || '')}"></div>
                <div class="field"><label>Skills</label><textarea name="skills" placeholder="e.g. Node.js, SQL, React">${esc(p.skills || '')}</textarea></div>
                <div><button class="btn primary" type="submit">Save profile</button></div>
              </form>
              <div class="card" style="gap:14px">
                <h3>Resume</h3>
                <div class="muted" style="font-size:.9rem">${p.resumeName ? `Current: <b>${esc(p.resumeName)}</b>` : 'No resume uploaded yet.'}</div>
                <input type="file" id="resume-file" accept=".pdf,.doc,.docx">
                <div class="row">
                  <button class="btn primary" id="upload-resume">Upload resume</button>
                  ${p.resumeUrl ? `<button class="btn ghost" id="dl-resume">Download</button>` : ''}
                </div>
                <div class="muted" style="font-size:.8rem">PDF or Word, up to 5 MB.</div>
              </div>
            </div>
          </section>`;
        $('#cand-form').onsubmit = async (e) => { e.preventDefault(); const body = Object.fromEntries(new FormData(e.target)); try { await api('/api/candidates/me', { method: 'PUT', body: JSON.stringify(body) }); toast('Profile saved', 'ok'); } catch (err) { toast(err.message, 'err'); } };
        $('#upload-resume').onclick = async () => {
          const f = $('#resume-file').files[0];
          if (!f) return toast('Choose a file first', 'err');
          const fd = new FormData(); fd.append('resume', f);
          try { const r = await api('/api/candidates/me/resume', { method: 'POST', body: fd }); toast('Resume uploaded', 'ok'); renderProfile(); } catch (err) { toast(err.message, 'err'); }
        };
        const dl = $('#dl-resume'); if (dl) dl.onclick = () => downloadWithAuth('/api/candidates/' + state.user.id + '/resume', p.resumeName);
      } else if (state.user.role === 'employer') {
        let p;
        try { p = await api('/api/employers/me'); } catch (e) { main.innerHTML = errHtml(e.message); return; }
        main.innerHTML = `
          <section class="view">
            <div class="section-title"><div><h2>Company profile</h2><div class="muted">${p.openJobs} open · ${p.totalJobs} total job listings</div></div></div>
            <form class="card" id="emp-form" style="max-width:680px;gap:14px">
              <div class="field"><label>Company name</label><input name="companyName" required value="${esc(p.companyName || '')}"></div>
              <div class="row" style="gap:14px">
                <div class="field" style="flex:1;min-width:200px"><label>Industry</label><input name="industry" placeholder="e.g. Software" value="${esc(p.industry || '')}"></div>
                <div class="field" style="flex:1;min-width:200px"><label>Website</label><input name="website" placeholder="https://…" value="${esc(p.website || '')}"></div>
              </div>
              <div class="field"><label>About</label><textarea name="description" placeholder="What does your company do?">${esc(p.description || '')}</textarea></div>
              <div><button class="btn primary" type="submit">Save company</button></div>
            </form>
          </section>`;
        $('#emp-form').onsubmit = async (e) => { e.preventDefault(); const body = Object.fromEntries(new FormData(e.target)); try { await api('/api/employers/me', { method: 'PUT', body: JSON.stringify(body) }); toast('Company saved', 'ok'); } catch (err) { toast(err.message, 'err'); } };
      }
    }

    /* ---------------- admin ---------------- */
    async function renderAdmin() {
      const main = $('#main');
      main.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
      let stats, users;
      try { [stats, users] = await Promise.all([api('/api/admin/stats'), api('/api/admin/users')]); } catch (e) { main.innerHTML = errHtml(e.message); return; }
      main.innerHTML = `
        <section class="view">
          <div class="section-title"><div><h2>Admin</h2><div class="muted">Platform overview &amp; user management</div></div></div>
          <div class="stat-cards">
            <div class="stat-card"><div class="k">Users</div><div class="v">${stats.users}</div></div>
            <div class="stat-card"><div class="k">Candidates</div><div class="v">${stats.candidates}</div></div>
            <div class="stat-card"><div class="k">Employers</div><div class="v">${stats.employers}</div></div>
            <div class="stat-card"><div class="k">Jobs</div><div class="v">${stats.jobs}</div></div>
            <div class="stat-card"><div class="k">Open jobs</div><div class="v">${stats.openJobs}</div></div>
            <div class="stat-card"><div class="k">Applications</div><div class="v">${stats.applications}</div></div>
          </div>
          <div class="card" style="padding:0;overflow:auto">
            <div class="between" style="padding:14px 16px"><b>Users</b><input id="u-search" placeholder="Search name or email" style="width:auto;max-width:260px"></div>
            <table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr></thead>
            <tbody id="u-body">${userRows(users)}</tbody></table>
          </div>
        </section>`;
      const rerender = async (search = '') => { const list = await api('/api/admin/users' + (search ? `?search=${encodeURIComponent(search)}` : '')); $('#u-body').innerHTML = userRows(list); bindUserRows(); };
      let t; $('#u-search').oninput = (e) => { clearTimeout(t); t = setTimeout(() => rerender(e.target.value.trim()), 320); };
      bindUserRows();
      function bindUserRows() {
        $$('#u-body [data-role]').forEach((sel) => sel.onchange = async () => {
          try { await api(`/api/admin/users/${sel.dataset.role}/role`, { method: 'PATCH', body: JSON.stringify({ role: sel.value }) }); toast('Role updated', 'ok'); } catch (e) { toast(e.message, 'err'); }
        });
        $$('#u-body [data-deluser]').forEach((b) => b.onclick = async () => { if (!confirm('Delete this user?')) return; try { await api('/api/admin/users/' + b.dataset.deluser, { method: 'DELETE' }); toast('Deleted'); rerender($('#u-search').value.trim()); } catch (e) { toast(e.message, 'err'); } });
      }
      function userRows(list) {
        return list.map((u) => `<tr>
          <td>${u.id}</td><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td>
          <td><select data-role="${u.id}" style="width:auto"><option value="candidate" ${u.role === 'candidate' ? 'selected' : ''}>candidate</option><option value="employer" ${u.role === 'employer' ? 'selected' : ''}>employer</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>admin</option></select></td>
          <td class="muted">${esc(fmtDate(u.createdAt))}</td>
          <td>${u.id === state.user.id ? '<span class="muted" style="font-size:.8rem">you</span>' : `<button class="btn danger sm" data-deluser="${u.id}">Delete</button>`}</td>
        </tr>`).join('');
      }
    }

    /* ---------------- shared ---------------- */
    function emptyHtml(title, sub) { return `<div class="empty"><div class="ic">📭</div><h3 style="margin:8px 0 4px">${esc(title)}</h3><div class="muted">${esc(sub)}</div></div>`; }
    function errHtml(msg) { return `<div class="empty"><div class="ic">⚠️</div><h3 style="margin:8px 0 4px">Something went wrong</h3><div class="muted">${esc(msg)}</div><div style="margin-top:14px"><button class="btn primary" onclick="location.reload()">Reload</button></div></div>`; }

    (async function init() { await loadMe(); render(); })();
  </script>
</body>
</html>
